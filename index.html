<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080e17" />
  <meta name="description" content="NBA Edge — player stats, matchup history and sportsbook line research." />
  <title>NBA Edge — Player Prop Research</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#dashboard" aria-label="NBA Edge home">
        <span class="brand-mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 24L12 16L17 20L27 8" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 8H27V15" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">NBA<span>EDGE</span><small>ANALYTICS PLATFORM</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav-list" id="mainNav">
        <button class="nav-link active" data-view="dashboard"><span class="nav-icon">▦</span><span>Overview</span></button>
        <a class="nav-link" href="#insights" data-view="insights"><span class="nav-icon" aria-hidden="true">ϟ</span><span>Today’s Insights</span></a>
        <a class="nav-link" href="#record" data-view="record"><span class="nav-icon" aria-hidden="true">✓</span><span>Track record</span></a>
        <button class="nav-link" data-view="analyzer"><span class="nav-icon">◈</span><span>Prop analyzer</span></button>
        <button class="nav-link" data-view="odds"><span class="nav-icon">⌁</span><span>Odds scanner</span></button>
        <button class="nav-link" data-view="live"><span class="nav-icon">◉</span><span>Live game data</span></button>
      </nav>
      <div class="nav-label" style="margin-top:28px">ACCOUNT</div>
      <nav class="nav-list"><button class="nav-link" data-view="account"><span class="nav-icon">♙</span><span>My account</span></button></nav>
      <div class="side-bottom">
        <div class="status-panel"><span class="status-dot"></span><div><strong id="connectionName">Research demo</strong><small id="connectionSub">Player stats and matchups</small></div></div>
        <div class="side-disclaimer">Research tools only. No guaranteed predictions or live DraftKings integration.</div>
      </div>
    </aside>
    <div class="main-area">
      <header class="topbar">
        <div class="top-left"><button class="mobile-menu" id="mobileMenu" aria-label="Toggle menu">☰</button><span class="breadcrumb">WORKSPACE <span>/</span> <b id="topCrumb">OVERVIEW</b></span></div>
        <div class="top-actions"><span class="top-date" id="topDate"></span><span class="avatar" id="topAvatar">G</span><button id="topAccountButton" class="top-account">Guest</button></div>
      </header>
      <main id="mainContent" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div id="toastArea" class="toast-area" aria-live="polite"></div>
  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
